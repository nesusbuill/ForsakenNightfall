apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.studios.forsaken2d'
    compileSdk 34

    defaultConfig {
        applicationId "com.studios.forsaken2d"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // 🔥 MULTIDEX — Bắt buộc cho máy 32-bit
        multiDexEnabled true

        // ❌ BỎ ndk.abiFilters — vì app Kotlin thuần không có native lib
    }

    // ✅ ĐƠN GIẢN HÓA TÊN FILE — KHÔNG cần splits ABI
    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildType = variant.buildType.name
            def version = variant.versionName
            outputFileName = "FORSAKEN-NIGHTFALL-v${version}-${buildType}.apk"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources.excludes += [
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE',
            'META-INF/NOTICE',
            'META-INF/*.kotlin_module'
        ]
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'org.json:json:20231013'
}
