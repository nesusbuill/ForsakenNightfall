name: Build Forsaken Nightfall

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 DEBUG — Kiểm tra file AndroidManifest
        run: |
          echo "===== BRANCH ĐANG BUILD ====="
          git branch --show-current
          echo ""
          echo "===== TÌM TẤT CẢ FILE AndroidManifest ====="
          find . -iname "androidmanifest*" 2>/dev/null
          echo ""
          echo "===== KIỂM TRA FILE CHÍNH ====="
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            echo "✅ TÌM THẤY ĐÚNG PATH!"
            echo "--- Kích thước: $(wc -c < app/src/main/AndroidManifest.xml) bytes"
            echo "--- Nội dung 3 dòng đầu:"
            head -3 app/src/main/AndroidManifest.xml
          else
            echo "❌ KHÔNG TÌM THẤY app/src/main/AndroidManifest.xml!"
            echo "--- Các file XML hiện có trong app/src/:"
            find app/src -name "*.xml" 2>/dev/null
            exit 1
          fi

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 🔨 Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORSAKEN-NIGHTFALL
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
